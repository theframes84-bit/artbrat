<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTBRAT</title>
  <!-- Bootstrap Icons for glowing headphones icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --accent: #00f0ff;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      overflow: hidden;
    }
    .video-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 1;
    }
    .hero-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 40px;
      pointer-events: none;
    }
    .bottom-section {
      text-align: center;
      pointer-events: auto;
      margin-bottom: 30px;
    }
    .inquiry-btn {
      display: inline-block;
      font-size: 0.85rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #ffffff;
      padding: 14px 32px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .inquiry-btn:hover {
      background: #ffffff;
      color: #000000;
    }
    .audio-toggle {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.4);
      color: #ffffff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
    }
    .audio-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
    }
    .audio-toggle:hover {
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .hero-overlay {
        padding: 20px;
      }
      .bottom-section {
        margin-bottom: 20px;
      }
      .inquiry-btn {
        padding: 12px 24px;
        font-size: 0.75rem;
      }
      .audio-toggle {
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video (HotRod.mp4) -->
  <video class="video-bg" id="bg-video" autoplay muted loop playsinline>
    <source src="assets/HotRod.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Separate WAV Audio Track -->
  <audio id="bg-audio" loop>
    <source src="assets/144453__ears68__hot-rods-angryv8-supercharged-coming-to-race-xdr019.wav" type="audio/wav">
  </audio>

  <!-- Glowing Headphones Toggle Button (Starts Active/On) -->
  <button class="audio-toggle active" id="audio-btn" onclick="toggleAudio()" title="Toggle Sound">
    <i class="bi bi-headphones" id="audio-icon"></i>
  </button>

  <div class="hero-overlay">
    <div class="bottom-section">
      <a href="mailto:info@codes.gallery?subject=Artbrat%20Inquiry" class="inquiry-btn">FOR INQUIRIES</a>
    </div>
  </div>

  <script>
    const audio = document.getElementById('bg-audio');
    const btn = document.getElementById('audio-btn');
    const icon = document.getElementById('audio-icon');
    let isPlaying = false;

    // Attempt to start audio immediately (modern browsers allow if user interacted or page has autoplay permission)
    window.addEventListener('DOMContentLoaded', () => {
      audio.play().then(() => {
        isPlaying = true;
        btn.classList.add('active');
      }).catch(e => {
        console.log("Autoplay blocked by browser policy, waiting for user interaction:", e);
        isPlaying = false;
        btn.classList.remove('active');
      });
    });

    // Also try playing on first click anywhere if blocked
    document.addEventListener('click', function initAudio() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          btn.classList.add('active');
        }).catch(() => {});
      }
    }, { once: true });

    function toggleAudio() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          btn.classList.add('active');
        }).catch(e => console.log("Audio play prevented:", e));
      } else {
        audio.pause();
        isPlaying = false;
        btn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
